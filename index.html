<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Honda Fit — Manual de reparação</title>
  <style>
    :root {
      --ink: #1a1b1e;
      --muted: #3c4250;
      --line: #d5d8e0;
      --paper: #f4f5f7;
      --red: #9d0b16;
      --red-ink: #7d0912;
      --focus: #9d0b16;
      --s-1: 0.25rem;
      --s-2: 0.5rem;
      --s-3: 0.75rem;
      --s-4: 1rem;
      --s-5: 1.5rem;
      --s-6: 2rem;
      --s-7: 3rem;
      --s-8: 4rem;
      --sidebar: 18rem;
      --page: 68rem;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      color: var(--ink);
      background: #fff;
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-size: 1rem;
      line-height: 1.45;
    }

    ::selection {
      background: #f0c9cc;
      color: var(--ink);
    }

    :focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 3px;
    }

    .skip {
      position: absolute;
      left: 0.75rem;
      top: 0.75rem;
      transform: translateY(-160%);
      background: var(--red);
      color: #fff;
      padding: 0.55rem 0.8rem;
      z-index: 5;
    }

    .skip:focus { transform: none; }

    .car {
      display: flex;
      justify-content: center;
      background: #fff;
    }

    .car img {
      height: 6.5rem;
      width: auto;
      max-width: 100%;
      object-fit: contain;
    }

    .band { background: var(--red); color: #fff; }

    .band-inner {
      max-width: var(--page);
      margin: 0 auto;
      padding: var(--s-4) var(--s-5);
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 4vw, 2.75rem);
      font-weight: 700;
      letter-spacing: -0.04em;
      line-height: 0.95;
      text-wrap: balance;
    }

    .band p {
      margin: var(--s-1) 0 0;
      max-width: 36rem;
    }

    .shell {
      display: grid;
      grid-template-columns: var(--sidebar) minmax(0, 1fr);
      align-items: start;
      max-width: var(--page);
      margin: 0 auto;
      background: #fff;
    }

    .finder {
      position: sticky;
      top: 0;
      max-height: 100vh;
      overflow: auto;
      padding: var(--s-4) 0 var(--s-6);
      border-right: 1px solid var(--line);
      background: #fff;
      scrollbar-color: #c4c8d1 transparent;
    }

    .finder form { padding: 0 var(--s-4) var(--s-3); }

    label {
      display: block;
      margin-bottom: var(--s-2);
      font-weight: 600;
    }

    input[type="search"] {
      width: 100%;
      min-height: 2.75rem;
      margin: 0;
      padding: var(--s-2) var(--s-3);
      border: 1px solid #b7bdc8;
      border-radius: 0;
      background: #fff;
      color: var(--ink);
      font: inherit;
      appearance: none;
    }

    #resultado {
      min-height: 1.25rem;
      margin: var(--s-2) 0 0;
      color: var(--muted);
      font-size: 0.92rem;
    }

    #sumario { display: grid; }

    #sumario a {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--s-3);
      min-height: 2.75rem;
      padding: var(--s-2) var(--s-4);
      color: var(--ink);
      text-decoration: none;
    }

    #sumario a:hover { background: var(--paper); }

    #sumario a[aria-current="true"] {
      background: var(--red);
      color: #fff;
    }

    #sumario .n {
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }

    #sumario a[aria-current="true"] .n { color: #fff; }

    main {
      min-width: 0;
      padding: var(--s-5) var(--s-6) var(--s-8);
    }

    .secao { scroll-margin-top: var(--s-4); }

    .secao + .secao { margin-top: var(--s-7); }

    .secao h2 {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: var(--s-4);
      margin: 0 0 var(--s-3);
      padding-bottom: var(--s-2);
      border-bottom: 2px solid var(--red);
      font-size: clamp(1.45rem, 2vw, 1.8rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.15;
      text-wrap: balance;
    }

    .secao h2 .n,
    summary .n {
      color: var(--muted);
      font-size: 0.95rem;
      font-weight: 500;
      font-variant-numeric: tabular-nums;
    }

    .links {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      grid-template-columns: 1fr;
    }

    .links a {
      display: block;
      padding: var(--s-3) 0;
      border-bottom: 1px solid var(--line);
      color: var(--ink);
      text-decoration-thickness: 1px;
      text-underline-offset: 0.16em;
    }

    .links a:hover { color: var(--red-ink); }

    .secao > .links + details { margin-top: var(--s-6); }

    .secao details + details { margin-top: var(--s-3); }

    details { background: var(--paper); }

    summary {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--s-4);
      min-height: 2.75rem;
      padding: var(--s-3) var(--s-4);
      font-weight: 600;
      cursor: pointer;
      list-style: none;
    }

    summary::-webkit-details-marker { display: none; }

    summary::after {
      content: "";
      flex: none;
      width: 0.45rem;
      height: 0.45rem;
      margin-right: 0.15rem;
      border-right: 2px solid currentColor;
      border-bottom: 2px solid currentColor;
      transform: translateY(-0.12rem) rotate(45deg);
    }

    details[open] summary::after {
      transform: translateY(0.12rem) rotate(225deg);
    }

    details .links {
      padding: 0 var(--s-4) var(--s-2);
      background: #fff;
    }

    .estado {
      margin: var(--s-6) 0;
      color: var(--muted);
    }

    #topo {
      position: fixed;
      right: var(--s-4);
      bottom: var(--s-4);
      min-height: 2.75rem;
      border: 0;
      background: var(--red);
      color: #fff;
      padding: var(--s-3) var(--s-4);
      font: inherit;
      cursor: pointer;
    }

    #topo[hidden] { display: none; }

    @media (max-width: 800px) {
      .car img { height: 5rem; }

      .band-inner { padding: var(--s-4); }

      .shell { display: block; }

      .finder {
        position: sticky;
        top: 0;
        z-index: 3;
        max-height: none;
        overflow: visible;
        padding: var(--s-3) 0 0;
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }

      #sumario {
        display: flex;
        gap: var(--s-2);
        overflow-x: auto;
        padding: 0 var(--s-4) var(--s-3);
        scrollbar-width: none;
      }

      #sumario::-webkit-scrollbar { display: none; }

      #sumario a {
        flex: none;
        border: 1px solid var(--line);
      }

      main { padding: var(--s-4) var(--s-4) var(--s-8); }

      .secao { scroll-margin-top: 11rem; }

      .links { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <a class="skip" href="#conteudo">Ir para o conteúdo</a>
  <header>
    <div class="car">
      <img src="honda-fit.jpg" alt="Honda Fit da primeira geração">
    </div>
    <div class="band">
      <div class="band-inner">
        <h1 id="titulo">Honda Fit</h1>
        <p id="subtitulo">Manual de reparação da primeira geração</p>
      </div>
    </div>
  </header>
  <div class="shell">
    <div class="finder">
      <form role="search" id="busca">
        <label for="q">Buscar no sumário</label>
        <input id="q" type="search" autocomplete="off" enterkeyhint="search">
        <p id="resultado" aria-live="polite"></p>
      </form>
      <nav id="sumario" aria-label="Seções"></nav>
    </div>
    <main id="conteudo">
      <p class="estado">Carregando o sumário…</p>
    </main>
  </div>
  <button id="topo" type="button" hidden>Voltar ao topo</button>
  <noscript>
    <p class="estado">O sumário precisa de JavaScript para ler o índice.</p>
  </noscript>
  <script>
    const titulo = document.querySelector("#titulo");
    const subtitulo = document.querySelector("#subtitulo");
    const sumario = document.querySelector("#sumario");
    const conteudo = document.querySelector("#conteudo");
    const campo = document.querySelector("#q");
    const resultado = document.querySelector("#resultado");
    const topo = document.querySelector("#topo");
    const secoes = [];

    document.querySelector("#busca").addEventListener("submit", (event) => {
      event.preventDefault();
      campo.blur();
    });

    function normalizar(texto) {
      return texto.normalize("NFD").replace(/\p{M}/gu, "").toLowerCase();
    }

    function elemento(tag, atributos, filhos) {
      const no = document.createElement(tag);
      Object.entries(atributos || {}).forEach(([chave, valor]) => {
        if (chave === "text") no.textContent = valor;
        else if (valor != null) no.setAttribute(chave, valor);
      });
      (filhos || []).forEach((filho) => no.append(filho));
      return no;
    }

    function lista(links) {
      const ul = elemento("ul", { class: "links" });
      const itens = links.map((link) => {
        const ancora = elemento("a", {
          href: link.href,
          target: "_blank",
          rel: "noopener noreferrer",
          text: link.titulo
        });
        const li = elemento("li", {}, [ancora]);
        ul.append(li);
        return { li, text: normalizar(`${link.titulo} ${link.grupo || ""}`) };
      });
      return { ul, itens };
    }

    function renderizar(dados) {
      document.title = `${dados.titulo} — ${dados.subtitulo}`;
      titulo.textContent = dados.titulo;
      subtitulo.textContent = dados.subtitulo;
      conteudo.replaceChildren();

      dados.secoes.forEach((secao) => {
        const total = secao.grupos.reduce((soma, grupo) => soma + grupo.links.length, 0);
        const navContagem = elemento("span", { class: "n", text: String(total) });
        const nav = elemento("a", { href: `#${secao.id}` }, [
          document.createTextNode(secao.titulo),
          navContagem
        ]);
        sumario.append(nav);

        const tituloContagem = elemento("span", { class: "n", text: String(total) });
        const bloco = elemento("section", { class: "secao", id: secao.id });
        bloco.append(elemento("h2", {}, [
          document.createTextNode(secao.titulo),
          tituloContagem
        ]));

        const grupos = [];
        secao.grupos.forEach((grupo) => {
          const ordenados = grupo.links.slice().sort((a, b) => (a.order ?? 0) - (b.order ?? 0));
          const itensLista = lista(ordenados.map((link) => ({ ...link, grupo: grupo.titulo || "" })));
          let caixa;
          let contagem = null;
          if (grupo.titulo) {
            const aberto = grupo.links.length <= 16;
            caixa = elemento("details", aberto ? { open: "" } : {});
            caixa.open = aberto;
            contagem = elemento("span", { class: "n", text: String(grupo.links.length) });
            caixa.append(elemento("summary", {}, [
              document.createTextNode(grupo.titulo),
              contagem
            ]));
            caixa.append(itensLista.ul);
          } else {
            caixa = itensLista.ul;
          }
          bloco.append(caixa);
          grupos.push({
            el: caixa,
            items: itensLista.itens,
            count: contagem,
            total: grupo.links.length,
            defaultOpen: caixa.open === true
          });
        });

        conteudo.append(bloco);
        secoes.push({ el: bloco, nav, navContagem, tituloContagem, total, grupos });
      });

      sumario.addEventListener("click", (event) => {
        const link = event.target.closest("a");
        if (!link) return;
        const id = link.getAttribute("href").slice(1);
        const destino = document.getElementById(id);
        if (!destino) return;
        event.preventDefault();
        destino.scrollIntoView({ behavior: "smooth", block: "start" });
        marcar(id);
      });

      const observador = new IntersectionObserver((entries) => {
        const visivel = entries.filter((entry) => entry.isIntersecting).pop();
        if (visivel) marcar(visivel.target.id);
      }, { rootMargin: "-15% 0px -75% 0px" });
      secoes.forEach((secao) => observador.observe(secao.el));

      campo.addEventListener("input", filtrar);
      const inicial = new URLSearchParams(location.search).get("q");
      if (inicial) campo.value = inicial;
      filtrar();
      if (!inicial && location.hash) {
        const destino = document.getElementById(decodeURIComponent(location.hash.slice(1)));
        if (destino) destino.scrollIntoView({ block: "start" });
      }
    }

    function marcar(id) {
      secoes.forEach((secao) => {
        const atual = secao.el.id === id;
        if (atual) secao.nav.setAttribute("aria-current", "true");
        else secao.nav.removeAttribute("aria-current");
      });
    }

    function filtrar() {
      const consulta = normalizar(campo.value.trim());
      let visiveis = 0;
      secoes.forEach((secao) => {
        let naSecao = 0;
        secao.grupos.forEach((grupo) => {
          let noGrupo = 0;
          grupo.items.forEach((item) => {
            const combina = !consulta || item.text.includes(consulta);
            item.li.hidden = !combina;
            if (combina) noGrupo += 1;
          });
          grupo.el.hidden = noGrupo === 0;
          if (grupo.count) grupo.count.textContent = String(consulta ? noGrupo : grupo.total);
          if (grupo.el.tagName === "DETAILS") {
            grupo.el.open = consulta ? noGrupo > 0 : grupo.defaultOpen;
          }
          naSecao += noGrupo;
        });
        secao.el.hidden = naSecao === 0;
        secao.nav.hidden = naSecao === 0;
        const contagem = String(consulta ? naSecao : secao.total);
        secao.navContagem.textContent = contagem;
        secao.tituloContagem.textContent = contagem;
        visiveis += naSecao;
      });
      if (!consulta) resultado.textContent = "";
      else if (visiveis === 0) resultado.textContent = "Nenhum procedimento encontrado.";
      else resultado.textContent = `${visiveis} procedimento${visiveis === 1 ? "" : "s"}`;
    }

    topo.addEventListener("click", () => {
      window.scrollTo({ top: 0, behavior: "smooth" });
      campo.focus();
    });

    document.addEventListener("scroll", () => {
      topo.hidden = window.scrollY < 480;
    }, { passive: true });

    fetch(new URL("indice.json", document.baseURI))
      .then((resposta) => {
        if (!resposta.ok) throw new Error(String(resposta.status));
        return resposta.json();
      })
      .then(renderizar)
      .catch(() => {
        conteudo.replaceChildren(elemento("p", {
          class: "estado",
          text: "Não foi possível carregar o sumário."
        }));
      });
  </script>
</body>
</html>
