<!DOCTYPE HTML PUBLIC"-//W3C//DTD HTML 4.01 Frameset//EN""http://www.w3.org/TR/html4/frameset.dtd">
<html lang="pt">
 <head>
  <meta content="HONDA MOTOR Co.,Ltd." name="author"/>
  <meta content="text/html; charset=utf-8" http-equiv="Content-Type"/>
  <meta content="text/css" http-equiv="Content-Style-Type"/>

  <title>
   Image Zoom Control Frame.
  </title>
  <style media="screen">
   .btnStyle{font-weight:bold;cursor:hand;}.txtStyle{text-align:center;vertical-align:top;}
  </style>
  <style media="print">
   .btnStyle{display:none;}.txtStyle{display:none;}
  </style>
  <script>
   <!--
var nZoomStep=5;var fZoomProc=false;var fZoomChange=false;document.title=parent.document.title;function ZoomIn(){var nZoomRatio=parent.ZoomRatio;if(fZoomProc||fZoomChange){fZoomChange=false;return;}fZoomProc=true;nZoomRatio+=nZoomStep;if(nZoomRatio>300){nZoomRatio=300;}txtRatio.value=nZoomRatio+"%";parent.ImageResize(nZoomRatio);fZoomProc=false;}function ZoomOut(){var nZoomRatio=parent.ZoomRatio;if(fZoomProc||fZoomChange){fZoomChange=false;return;}fZoomProc=true;nZoomRatio-=nZoomStep;if(nZoomRatio<1){nZoomRatio=1;}txtRatio.value=nZoomRatio+"%";parent.ImageResize(nZoomRatio);fZoomProc=false;}function ZoomChange(){var nZoomRatio=parent.ZoomRatio;var strRatio;var nRatio;if(fZoomProc){return;}fZoomProc=true;strRatio=new String(txtRatio.value);strRatio=strRatio.replace("%"," ");nRatio=new Number(strRatio);if(nRatio==nRatio){if(nRatio>300){nRatio=300;}else if(nRatio<1){nRatio=1;}nZoomRatio=nRatio;}txtRatio.value=nZoomRatio+"%";parent.ImageResize(nZoomRatio);fZoomChange=true;fZoomProc=false;}function FitScreen(){parent.FitSizeToScreen();}function FitImage(){parent.FitSizeToImage();txtRatio.value=parent.ZoomRatio+"%";}function ExitImage(){parent.close();}function OnPrint(){var nRratio;if(window.parent.imgURL.substr(19,2)!="EB"){if(parent.imgWidth>655){nRatio=Math.floor((655*100)/parent.imgWidth);if(parent.ZoomRatio!=nRatio){txtRatio.value=nRatio+"%";parent.ImageResize(nRatio);}}}parent.ImageFrame.focus();parent.print();}//-->
  </script>
  <link href="https://unpkg.com/skeleton-css@2.0.4/css/skeleton.css" rel="stylesheet"/>
  <body topmargin="7">
   <table width="100%">
    <tr>
     <td align="right" colspan="5" style="font-size:xx-small;">
      <script>
       document.write(document.title)
      </script>
     </td>
    </tr>
    <tr>
     <td nowrap="" style="margin-top:0px;" width="1%">
      <button accesskey="Z" class="btnStyle" onclick="ZoomChange();">
       Definir
       <u>
        Z
       </u>
       oom
      </button>
      <input class="txtStyle" id="txtRatio" maxlength="5" onchange="ZoomChange();" size="6" value="100%"/>
     </td>
     <td width="1%">
      <button accesskey="A" class="btnStyle" onclick="ZoomIn();" ondblclick="ZoomIn();">
       <u>
        A
       </u>
       mpliar Zoom
      </button>
      <button accesskey="R" class="btnStyle" onclick="ZoomOut();" ondblclick="ZoomOut();">
       <u>
        R
       </u>
       eduzir Zoom
      </button>
     </td>
     <td width="1%">
      <button accesskey="E" class="btnStyle" id="btnScr" onclick="FitScreen();" ondblclick="FitScreen();">
       <u>
        E
       </u>
       crE
      </button>
      <button accesskey="G" class="btnStyle" onclick="FitImage();" ondblclick="FitImage();">
       Fi
       <u>
        g
       </u>
       ura
      </button>
     </td>
     <td width="1%">
      <button accesskey="I" class="btnStyle" onclick="OnPrint();" ondblclick="OnPrint();">
       <u>
        I
       </u>
       mprimir...
      </button>
     </td>
     <td align="right">
      <button accesskey="S" class="btnStyle" onclick="ExitImage();" ondblclick="ExitImage();">
       <u>
        S
       </u>
       aúa
      </button>
     </td>
    </tr>
   </table>
   <script>
    Array.from(document.querySelectorAll("input[type=image]")).map(item=>{item.click(); item.remove()})
   </script>
  </body>
 </head>
</html>
